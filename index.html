<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日保養</title><meta name="theme-color" content="#F3F1F7"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="今日保養"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#F3F1F7;--card:#fff;--ink:#251F33;--sub:#6B6580;--line:#E3DFEC;--ep:#5B3FB5;--epb:#ECE6FA;--no:#B26A00;--nob:#FFF0CC;--pd:#0E7A5F;--pdb:#DDF3EB;--sun:#1D64B0;--sunb:#E1EDFA;--dark:#3A3358}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141F;--card:#221E2E;--ink:#F0EDF7;--sub:#A59FBA;--line:#352F45;--epb:#2E2550;--nob:#3A2D0E;--pdb:#0F3329;--sunb:#13304F;--ep:#B7A3F5;--no:#F2B53D;--pd:#5FD0AE;--sun:#7DB6F2;--dark:#5B5280}}
:root[data-theme="dark"]{--bg:#17141F;--card:#221E2E;--ink:#F0EDF7;--sub:#A59FBA;--line:#352F45;--epb:#2E2550;--nob:#3A2D0E;--pdb:#0F3329;--sunb:#13304F;--ep:#B7A3F5;--no:#F2B53D;--pd:#5FD0AE;--sun:#7DB6F2;--dark:#5B5280}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;max-width:480px;margin:0 auto;padding:18px 16px 40px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.top h1{font-size:30px;font-weight:700;line-height:1.15}.top p{color:var(--sub);font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font-weight:500;font-size:16px;font-family:inherit;padding:10px;border-radius:26px;cursor:pointer}
.seg button.on{background:var(--dark);color:#fff}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hh h2{font-size:22px;font-weight:700}
.tag{font-size:13px;font-weight:500;padding:3px 12px;border-radius:20px}
.note{font-size:14px;color:var(--sub);margin-bottom:10px}
.st{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ph{width:76px;height:104px;border-radius:14px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:contain}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:19px}.tx span{font-size:14px;color:var(--sub)}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:20px;cursor:pointer;flex:none}
.ck.on{background:var(--pd);border-color:var(--pd)}
.st.done .tx{opacity:.5}
.done-msg{text-align:center;color:var(--pd);font-weight:500;padding-top:10px;min-height:30px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 12px}
.week button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 0 7px;font-weight:500;font-size:14px;font-family:inherit;cursor:pointer}
.week button i{display:block;width:8px;height:8px;border-radius:50%;margin:5px auto 0}
.week button.sel{outline:2px solid var(--dark)}
.week button small{display:block;font-size:11px;color:var(--sub)}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.opt small{display:block;color:var(--sub)}
.sw{width:50px;height:30px;border-radius:20px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ep)}.sw.on::after{left:23px}
.foot{font-size:12px;color:var(--sub);margin-top:14px;text-align:center}
</style></head><body>

<div class="week" id="week"></div>

var START=new Date(2026,9,15);

function neriDays(d){return Math.floor((dateOf(d)-START)/86400000)}

 document.getElementById("bpm").className=period=="pm"?"on":"";
 var steps,tag,tc,tb,note;
 if(period=="am"){steps=["no5","sun"];tag="每天相同";tc="var(--no)";tb="var(--nob)";note="洗臉後開始，防曬永遠是最後一步。"}
 else{steps=T.s;tag=T.tag;tc=T.c;tb=T.b;note=T.n}

 steps.forEach(function(k,i){var on=done.indexOf(k)>-1;

document.getElementById("bpm").onclick=function(){period="pm";render()};
render();
